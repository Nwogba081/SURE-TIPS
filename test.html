<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Football Data API Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f9; }
        pre { background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h2>Football-Data.org API Test (CORS-Friendly)</h2>
    <pre id="output">Loading data...</pre>

    <script>
        // Get FREE token at: https://www.football-data.org/client/register
        const API_TOKEN = "bb6aa1b92b7c4f32b97189b4be5a1c41 "; 
        
        async function fetchData() {
            const output = document.getElementById("output");
            try {
                // Example: Get Premier League matches (PL = Premier League)
                const response = await fetch('https://api.football-data.org/v4/competitions/PL/matches', {
                    headers: {
                        'X-Auth-Token': API_TOKEN
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }
                
                const data = await response.json();
                output.textContent = JSON.stringify(data, null, 2);
            } catch (err) {
                output.textContent = "Error: " + err.message;
            }
        }
        
        fetchData();
    </script>
</body>
</html>
