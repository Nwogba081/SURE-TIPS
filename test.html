<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sportmonks Quick Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f9; }
        pre { background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 5px; overflow-x: auto; font-size: 13px; }
    </style>
</head>
<body>
    <h2>Sportmonks API Test (CORS Bypassed)</h2>
    <pre id="output">Loading data...</pre>

    <script>
        const token = "c5XDiIO57sPUkv3jzKjzvlxuPOI1gqxg3eNRCjSVx5ICjE26ALScMIGvTxPX"; // ⚠️ Regenerate this later!
        const teamId = "85"; 
        
        // 1. The real Sportmonks URL
        const targetUrl = `https://api.sportmonks.com/v3/football/schedules/teams/${teamId}?api_token=${token}`;
        
        // 2. Wrap it in a free CORS proxy
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

        fetch(proxyUrl)
            .then(res => {
                if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
                return res.json();
            })
            .then(data => {
                document.getElementById("output").textContent = JSON.stringify(data, null, 2);
            })
            .catch(err => {
                document.getElementById("output").textContent = "Error: " + err.message;
            });
    </script>
</body>
</html>
